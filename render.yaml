# Render blueprint — New → Blueprint → pick this repo. Free web service; pair it with a free Neon Postgres
# (Render's own free Postgres is deleted after 30 days). Values marked sync:false are asked for in the dashboard.
services:
  - type: web
    name: ops-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/init_db.py && uvicorn agent.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: prod
      - key: APP_MODE
        value: demo
      - key: PRESENTATION_MODE
        value: "true"
      - key: COMPANY_NAME
        value: Northwind Facilities Ltd
      - key: COMPANY_EMAIL
        value: ops@northwindfacilities.co.uk
      - key: COMPANY_INITIALS
        value: NF
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: RESET_TOKEN
        generateValue: true
      - key: SETTINGS_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
