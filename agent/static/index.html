<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ops Agent — inbox & review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<style>
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .kpi{padding:12px 18px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line)}
  .kpi:last-child{border-right:0}
  .kpi small{font-size:11.5px;font-weight:600;color:var(--muted)}
  .kpi b{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.15}
  .kpi.hold b{color:var(--hold)}.kpi.bad b{color:var(--bad)}
  @media (max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .controls label{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text);font-size:12.5px;cursor:pointer}
  .controls select{height:36px;border:1px solid var(--line-strong);border-radius:8px;padding:0 10px;background:#fff;font-weight:700;font-size:12.5px}
  .controls .switch{position:relative;width:36px;height:20px;border-radius:999px;background:#D5D8D2;display:inline-block;transition:background .15s}
  .controls .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:999px;background:#fff;transition:left .15s}
  .controls input:checked + .switch{background:#5B21B6}.controls input:checked + .switch::after{left:18px}
  .controls input[type=checkbox]{position:absolute;opacity:0;width:0;height:0}
  .cols{display:grid;grid-template-columns:minmax(300px,1fr) minmax(360px,1.4fr) minmax(320px,1.15fr);gap:20px;align-items:start}
  @media (max-width:1200px){.cols{grid-template-columns:1fr 1fr}.col-ledger{grid-column:1/-1}}
  @media (max-width:760px){.cols{grid-template-columns:1fr}}
  .col{display:flex;flex-direction:column;max-height:calc(100vh - 250px);min-height:320px}
  .scroll{overflow:auto;flex:1}
  .item{padding:10px 16px;border-bottom:1px solid #F1F2EF;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center}
  .item:hover{background:#FAFAF8}.item.sel{background:#EEF2FD;box-shadow:inset 3px 0 0 var(--blue)}
  .item .seed{font-family:var(--mono);color:var(--faint);font-size:11px;width:2.2em}
  .item .subj{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .meta{grid-column:2;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .meta .file{font-family:var(--mono)}
  .item .chips{display:flex;gap:4px;align-items:center}
  .review{padding:18px 20px}
  .review .empty{color:var(--muted);padding:2.5rem 1rem;text-align:center}
  .review .title{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px;font-weight:800}
  .review .from{color:var(--muted);font-size:12px;margin-top:3px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:12.5px;margin:10px 0 0}
  .kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono);word-break:break-word}
  .reason{background:var(--holdbg);color:var(--hold);border-radius:10px;padding:10px 14px;font-weight:700;margin:12px 0;font-size:13px}
  .reason.ok{background:var(--okbg);color:var(--ok)}.reason.bad{background:var(--badbg);color:var(--bad)}.reason.grey{background:var(--greybg);color:var(--grey)}.reason.shadow{background:var(--shadowbg);color:var(--shadow)}
  .reason .rules{font-weight:500;font-size:11px;margin-top:3px;opacity:.8}
  .box{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:12.5px}
  .box h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  pre{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:11.5px;line-height:1.45;max-height:220px;overflow:auto}
  mark{background:#FFF3BF;padding:0 .1em}
  .verify.ok{color:var(--ok);font-weight:700}.verify.bad{color:var(--bad);font-weight:700}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  textarea{width:100%;font:inherit;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;min-height:60px;margin-top:10px;font-size:13px}
  textarea:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
  .timeline{list-style:none;margin:4px 0 0;padding:0;font-family:var(--mono);font-size:11.5px}
  .timeline li{display:flex;gap:10px;padding:3px 0;border-left:2px solid var(--line);padding-left:10px;align-items:center}
  .timeline li b{min-width:9.5em;font-weight:500;display:flex;gap:6px;align-items:center}
  .timeline li span{color:var(--muted)}
  .actrow{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;padding:3px 0;flex-wrap:wrap}
  .addparty input{width:100%;font:inherit;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;margin-top:3px}
  .addparty label{display:block;font-size:12px;font-weight:700;margin-top:8px}
  .tabs{display:flex;align-items:center;gap:2px;padding:4px 10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tabs button{padding:9px 10px;border:0;border-bottom:2px solid transparent;background:transparent;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px}
  .tabs button.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:800}
  .tabs a{margin-left:auto;font-size:12px;font-weight:700;text-decoration:none;padding:6px 0}
  table th{position:sticky;top:0;z-index:1}
  tr.click{cursor:pointer}tr.click:hover{background:#FAFAF8}
  td .doc b{display:block;font-size:12.5px}td .doc small{font-family:var(--mono);font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<main class="page">
  <div class="page-head">
    <div><h1>Inbox &amp; review</h1><div class="sub">Every document the agent processed. Held items show why it stopped and let you approve, reject or add the sender.</div></div>
    <div class="actions controls">
      <label title="Evaluate everything, execute nothing"><input type="checkbox" id="shadow"><span class="switch" aria-hidden="true"></span>Shadow mode</label>
      <label>Outage <select id="outage" aria-label="Simulate an outage"><option value="none">none</option><option value="qbo">QuickBooks</option><option value="hubspot">HubSpot</option><option value="slack">Slack</option></select></label>
      <button class="btn" id="resetBtn" type="button">Reset demo</button>
    </div>
  </div>

  <div class="kpis" id="tiles"></div>

  <div class="cols">
    <section class="card col col-inbox">
      <div class="head"><span>Inbox stream</span><span class="n" id="inboxN"></span></div>
      <div class="scroll" id="inbox"></div>
    </section>
    <section class="card col col-review">
      <div class="head"><span>Review</span><span class="n" id="reviewN"></span></div>
      <div class="scroll review" id="review"><div class="empty">Select an item on the left. Held items show why the agent stopped and let you approve or reject.</div></div>
    </section>
    <section class="card col col-ledger">
      <div class="head"><span>Ledger</span><span class="n" id="ledgerN"></span></div>
      <div class="tabs">
        <button data-f="all" class="on" type="button">All</button><button data-f="held" type="button">Waiting</button><button data-f="executed" type="button">Handled</button><button data-f="failed" type="button">Failed</button><button data-f="overrides" type="button">Human</button>
        <a href="/ledger?format=csv">Export CSV</a>
      </div>
      <div class="scroll"><table><thead><tr><th>#</th><th>Document</th><th>Party</th><th>Status</th><th>Reason</th><th>Cost</th></tr></thead><tbody id="ledger"></tbody></table></div>
    </section>
  </div>
</main>

<script src="/static/nav.js" data-page="inbox" data-title="Inbox &amp; review"></script>
<script>
const $ = s => document.querySelector(s);
const state = { items: [], status: null, sel: null, filter: 'all' };
const chipLabel = s => ({auto_approved:'Auto', executed:'Executed', held:'Held', approved:'Approved', rejected:'Rejected', failed:'Failed', ignore:'Ignored', shadow:'Shadow', received:'Received'})[s] || s;
const chip = (s, extra='') => `<span class="chip c-${s} ${extra}">${chipLabel(s)}</span>`;
const typeLabel = t => ({supplier_invoice:'invoice', customer_dispute:'complaint', remittance:'payment advice', credit_note:'credit note', ignore:'ignored', unknown:'unknown'})[t] || (t || '—');

async function load() {
  const [st, q] = await Promise.all([api('/status'), api('/queue')]);
  state.status = st; state.items = q.items;
  renderHeader(); renderInbox(); renderLedger();
  if (state.sel) loadReview(state.sel, true);
}

function renderHeader() {
  const s = state.status, c = s.counts || {};
  const handled = (c.executed||0) + (c.auto_approved||0) + (c.approved||0), held = (c.held||0), failed = (c.failed||0), ignored = (c.ignore||0);
  $('#tiles').innerHTML = `
    <div class="kpi"><small>Emails in this run</small><b>${s.emails ?? 0}</b></div>
    <div class="kpi"><small>Handled by the agent</small><b>${handled}</b></div>
    <div class="kpi hold"><small>Waiting for you</small><b>${held}</b></div>
    <div class="kpi ${failed ? 'bad' : ''}"><small>${failed ? 'Failed' : 'Ignored · cost this run'}</small><b>${failed ? failed : ignored + ' · $' + (s.cost_usd||0).toFixed(3)}</b></div>`;
  $('#shadow').checked = !!s.shadow_mode;
  $('#outage').value = s.simulate_outage || 'none';
  const b = $('#banner'); b.className = 'banner';
  if (s.resetting) { b.textContent = 'Resetting demo — clearing previous run…'; b.classList.add('show','info'); }
  else if (s.seeding) { b.textContent = `Seeding inbox ${s.seeding.done}/${s.seeding.total} (${s.seeding.mode})…`; b.classList.add('show','info'); }
  else if (s.shadow_mode) { b.textContent = 'Shadow mode: the agent evaluates everything but executes nothing. Turn it off to post to QuickBooks / HubSpot / Slack.'; b.classList.add('show','info'); }
  else if (s.last_error) { b.textContent = 'Last error: ' + s.last_error; b.classList.add('show','err'); }
  else if (s.llm === 'fake') { b.innerHTML = 'Fake model running (no Anthropic key) — classification and extraction are keyword stand-ins. Add a key in <a href="/settings">Settings</a>.'; b.classList.add('show','warn'); }
  $('#resetBtn').disabled = !!(s.resetting || s.seeding) || s.app_mode === 'live';
  $('#resetBtn').hidden = s.app_mode === 'live';
  renderNavStatus(s);
}

function renderInbox() {
  const items = state.items;
  $('#inboxN').textContent = items.length + ' documents';
  $('#inbox').innerHTML = items.map(it => `
    <div class="item ${state.sel===it.document_id?'sel':''}" data-id="${it.document_id}" id="doc-${it.document_id}">
      <span class="seed">#${it.seed_no ?? '·'}</span>
      <span class="subj" title="${esc(it.subject)}">${esc(it.subject)}</span>
      <span class="chips">${chip(it.status)}${it.injection ? '<span class="chip inj" title="instruction-like content detected and ignored">injection</span>' : ''}${it.human_override ? '<span class="chip human">human</span>' : ''}${it.simulated ? '<span class="chip sim" title="downstream system not configured — action simulated">sim</span>' : ''}</span>
      <span class="meta"><span class="file">${esc(it.filename === 'email-body.txt' ? 'email body' : it.filename)}</span> · ${esc(it.party_name || it.from_addr)} · ${typeLabel(it.doc_type)}${it.amount ? ' · ' + money(it.amount) : ''}${it.ref ? ' · ' + esc(it.ref) : ''}</span>
    </div>`).join('') || '<div class="review"><div class="empty">No emails yet — press Reset demo.</div></div>';
}
$('#inbox').addEventListener('click', e => { const el = e.target.closest('.item'); if (el) select(+el.dataset.id); });

function select(id) { state.sel = id; renderInbox(); loadReview(id); history.replaceState(null, '', '#doc-' + id); }

async function loadReview(id, quiet) {
  let d; try { d = await api('/review/' + id); } catch (e) { if (!quiet) toast(e.message); return; }
  const it = d.item, ex = it.extracted || {}, vr = it.verify_result;
  $('#reviewN').textContent = '#' + (it.seed_no ?? '') + ' · doc ' + it.document_id;
  const reasonClass = {executed:'ok', auto_approved:'ok', approved:'ok', failed:'bad', rejected:'bad', ignore:'grey', shadow:'shadow'}[it.status] || '';
  const snippet = highlight(esc(it.source_snippet || d.email_body || ''), ex);
  const extractedRows = Object.entries(ex).filter(([k,v]) => v !== null && v !== '' && !(Array.isArray(v) && !v.length)).map(([k,v]) =>
    `<dt>${esc(k.replace(/_/g,' '))}</dt><dd>${Array.isArray(v) ? esc(v.map(x => typeof x === 'object' ? (x.description + ' ' + (x.amount ?? '')) : x).join('; ')) : esc(v)}</dd>`).join('');
  const rulesDec = (d.decisions || []).filter(x => x.step === 'rules').pop();
  const triggered = rulesDec && rulesDec.output && rulesDec.output.triggered_rules ? rulesDec.output.triggered_rules.join(', ') : '';
  const canDecide = ['held','shadow'].includes(it.status), canRetry = it.status === 'failed', canReject = ['held','shadow','failed'].includes(it.status);
  const noMatch = /^no (supplier|customer) match/.test(it.reason || '');
  $('#review').innerHTML = `
    <div class="title">${esc(it.subject)} ${chip(it.status)}</div>
    <div class="from">from <span class="mono">${esc(it.from_addr)}</span> · <span class="mono">${esc(it.filename === 'email-body.txt' ? 'email body' : it.filename)}</span></div>
    <div class="reason ${reasonClass}">${esc(it.reason || '—')}${triggered ? `<div class="rules">rules: ${esc(triggered)}</div>` : ''}</div>
    <dl class="kv">
      <dt>type</dt><dd>${typeLabel(it.doc_type)}</dd>
      <dt>party</dt><dd>${esc(it.party_name || '—')}${it.party_kind ? ' <span class="muted">(' + it.party_kind + ')</span>' : ''}</dd>
      <dt>confidence</dt><dd>${it.confidence != null ? it.confidence.toFixed(2) : '—'}</dd>
      ${it.duplicate_of ? `<dt>duplicate of</dt><dd><a href="#" onclick="select(${it.duplicate_of});return false">doc #${it.duplicate_of}</a></dd>` : ''}
      <dt>model cost</dt><dd>$${(it.cost_usd||0).toFixed(4)}</dd>
    </dl>
    ${noMatch ? `<div class="box addparty" id="addParty"><h4>Not on file</h4><div class="muted" style="margin-bottom:8px">This sender is not in the directory. Add them once and this item is processed again automatically.</div><button class="btn small primary" type="button" onclick="suggestParty(${it.document_id})">Add as ${/customer/.test(it.reason) ? 'customer' : 'supplier'} →</button></div>` : ''}
    ${extractedRows ? `<div class="box"><h4>Extracted</h4><dl class="kv" style="margin:0">${extractedRows}</dl></div>` : ''}
    ${vr ? `<div class="box"><h4>Verifier — second model</h4><div class="verify ${vr.all_fields_present?'ok':'bad'}">${vr.all_fields_present ? '✓ every extracted value is literally present in the source' : '✗ unsupported: ' + esc((vr.missing_or_unsupported||[]).join(', '))}</div>${vr.notes ? `<div class="muted" style="margin-top:3px">${esc(vr.notes)}</div>` : ''}</div>` : ''}
    <div class="box"><h4>Source — what the agent read</h4><pre>${snippet}</pre></div>
    ${it.draft_reply ? `<div class="box"><h4>Draft reply — held with the ticket, never auto-sent</h4><pre>${esc(it.draft_reply)}</pre></div>` : ''}
    ${it.actions.length ? `<div class="box"><h4>Downstream actions</h4>${it.actions.map(a => `<div class="actrow">${chip(a.status==='ok'?'executed':'failed')} <b>${a.system}</b> ${a.external_id ? esc(a.external_id) : ''} ${a.result && a.result.url ? `<a href="${esc(a.result.url)}" target="_blank" rel="noopener">open ↗</a>` : ''} ${a.result && a.result.simulated ? '<span class="chip sim">simulated</span>' : ''} ${a.error ? `<span style="color:var(--bad)">${esc(a.error)}</span>` : ''}</div>`).join('')}</div>` : ''}
    ${(canDecide || canRetry) ? `<textarea id="note" placeholder="${canRetry ? 'Optional note' : 'Required: one line on why (recorded in the ledger)'}"></textarea>` : ''}
    <div class="actions">
      ${canDecide ? `<button class="btn primary" type="button" onclick="decide(${it.document_id},'approve')">Approve → execute</button>` : ''}
      ${canReject ? `<button class="btn" type="button" onclick="decide(${it.document_id},'reject')">Reject</button>` : ''}
      ${canRetry ? `<button class="btn cta" type="button" onclick="retry(${it.document_id})">Retry failed action</button>` : ''}
    </div>
    ${d.notes && d.notes.length ? `<div class="box"><h4>Human notes</h4>${d.notes.map(n => `<div class="actrow"><b>${n.action}</b> ${esc(n.note)} <span class="muted">· ${n.by} · ${new Date(n.at).toLocaleTimeString('en-GB')}</span></div>`).join('')}</div>` : ''}
    <div class="box"><h4>Timeline</h4><ul class="timeline">${it.timeline.map(t => `<li><b>${esc(t.step)}${t.model ? (t.model === 'fake' ? '<span class="chip sim">fake ai</span>' : '<span class="badge model">claude</span>') : ''}</b><span>${new Date(t.at).toLocaleTimeString('en-GB')}${t.duration_ms != null ? ' · ' + t.duration_ms + ' ms' : ''}${t.model && t.model !== 'fake' ? ' · ' + t.model : ''}</span></li>`).join('')}</ul></div>`;
}

function highlight(text, ex) {
  const vals = Object.values(ex || {}).filter(v => typeof v === 'string' || typeof v === 'number').map(String).filter(v => v.length > 2).sort((a,b)=>b.length-a.length);
  for (const v of vals) {
    const alt = [v, Number(v) ? Number(v).toLocaleString('en-GB',{minimumFractionDigits:2}) : null].filter(Boolean);
    for (const a of alt) { const re = new RegExp(a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g'); text = text.replace(re, m => `<mark>${m}</mark>`); }
  }
  return text;
}

async function suggestParty(id) {
  const box = document.getElementById('addParty');
  let sg; try { sg = await api('/api/parties/suggest/' + id); } catch (e) { toast(e.message); return; }
  box.innerHTML = `<h4>Add ${sg.kind}</h4>
    <div class="muted">${esc(sg.why)} — check the email the agent should recognise next time.</div>
    <label>Name<input id="p-name" value="${esc(sg.name)}"></label>
    <label>Email address(es)<input id="p-pat" class="mono" value="${esc(sg.emails.join(', '))}"></label>
    <label>Reference prefix <span class="muted" style="font-weight:500">(optional)</span><input id="p-prefix" class="mono" value="${esc((sg.reference_prefix || '').replace(/-$/, ''))}"></label>
    ${sg.kind === 'supplier' ? `<label>Expected invoice amount / PO <span class="muted" style="font-weight:500">(optional, ±5% check)</span><input id="p-po" class="mono" value="${sg.po_amount ?? ''}"></label>` : ''}
    <div class="actions"><button class="btn small primary" type="button" onclick="createPartyFromDoc(${id},'${sg.kind}')">Save &amp; process again</button><button class="btn small" type="button" onclick="loadReview(${id})">Cancel</button></div>`;
}
async function createPartyFromDoc(id, kind) {
  const body = { name: document.getElementById('p-name').value, identifier_patterns: document.getElementById('p-pat').value, reference_prefix: document.getElementById('p-prefix').value };
  if (kind === 'supplier') body.po_amount = document.getElementById('p-po').value || null;
  try { const r = await api(`/api/parties/from_document/${id}?kind=${kind}`, { method: 'POST', body: JSON.stringify(body) }); toast(`added · now ${r.status}`); await load(); }
  catch (e) { toast(e.message); }
}

async function decide(id, action) {
  const note = ($('#note') ? $('#note').value.trim() : '');
  if (note.length < 3) { toast('Please write a short note first'); $('#note').focus(); return; }
  try { const r = await api(`/${action}/${id}`, {method:'POST', body: JSON.stringify({note, by:'demo'})}); toast(`${action}d → ${r.status}`); await load(); }
  catch (e) { toast(e.message); }
}
async function retry(id) { try { const r = await api(`/retry/${id}`, {method:'POST'}); toast('retry → ' + r.status); await load(); } catch (e) { toast(e.message); } }

function renderLedger() {
  let rows = state.items;
  if (state.filter === 'held') rows = rows.filter(r => r.status === 'held');
  else if (state.filter === 'executed') rows = rows.filter(r => ['executed','approved','auto_approved'].includes(r.status));
  else if (state.filter === 'failed') rows = rows.filter(r => r.status === 'failed');
  else if (state.filter === 'overrides') rows = rows.filter(r => r.human_override);
  $('#ledgerN').textContent = rows.length + ' rows';
  $('#ledger').innerHTML = rows.map(r => `<tr class="click" data-id="${r.document_id}">
    <td class="mono muted">${r.seed_no ?? r.document_id}</td>
    <td><div class="doc"><b>${esc(r.ref || r.subject)}</b><small>${esc(r.filename === 'email-body.txt' ? 'email body' : r.filename)}</small></div></td>
    <td>${esc(r.party_name || '—')}</td>
    <td>${chip(r.status)}${r.human_override ? ' <span class="chip human">human</span>' : ''}</td>
    <td style="color:var(--text)">${esc(r.reason || '')}</td><td class="mono">$${(r.cost_usd||0).toFixed(3)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted" style="text-align:center;padding:20px">Nothing here.</td></tr>';
}
$('#ledger').addEventListener('click', e => { const tr = e.target.closest('tr'); if (tr && tr.dataset.id) select(+tr.dataset.id); });
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on')); b.classList.add('on'); state.filter = b.dataset.f; renderLedger(); }));

$('#shadow').addEventListener('change', async e => { try { await api('/shadow', {method:'POST', body: JSON.stringify({enabled: e.target.checked})}); toast('shadow mode ' + (e.target.checked ? 'on' : 'off')); await load(); } catch (err) { toast(err.message); } });
$('#outage').addEventListener('change', async e => { try { await api('/outage', {method:'POST', body: JSON.stringify({system: e.target.value})}); toast('outage: ' + e.target.value); await load(); } catch (err) { toast(err.message); } });
$('#resetBtn').addEventListener('click', async () => { if (!confirm('Wipe the current run and replay the 30 seed emails?')) return; try { await api('/reset', {method:'POST'}); toast('reset started'); state.sel = null; $('#review').innerHTML = '<div class="empty">Resetting…</div>'; setTimeout(load, 800); } catch (e) { toast(e.message); } });

function connect() {
  const es = new EventSource('/events');
  es.addEventListener('changed', () => load().catch(()=>{}));
  es.onerror = () => { es.close(); setTimeout(connect, 3000); };
}
load().then(() => { const m = location.hash.match(/doc-(\d+)/); if (m) { select(+m[1]); const el = document.getElementById('doc-' + m[1]); if (el) el.scrollIntoView({ block: 'center' }); } }).catch(e => toast(e.message));
connect();
</script>
</body>
</html>
