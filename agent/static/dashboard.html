<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ops Agent — dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<style>
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .kpi{padding:16px 20px;display:flex;flex-direction:column;gap:5px;border-right:1px solid var(--line)}
  .kpi:last-child{border-right:0}
  .kpi small{font-size:12px;font-weight:600;color:var(--muted)}
  .kpi b{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1.1}
  .kpi .d{font-size:12px;color:var(--muted)}.kpi .d em{font-style:normal;font-weight:700;color:var(--ok)}.kpi .d em.neg{color:var(--bad)}
  .kpi.hold b{color:var(--hold)}.kpi.bad b{color:var(--bad)}
  @media (max-width:900px){.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}
  .two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px}
  @media (max-width:1100px){.two{grid-template-columns:1fr}}
  .chartcard{padding:18px 20px 14px;display:flex;flex-direction:column;gap:10px;justify-content:space-between}
  .chartbody{margin-top:auto}
  .chartcard .top{display:flex;align-items:center;gap:12px}
  .chartcard .top b{font-size:14px;font-weight:800}
  .legend{margin-left:auto;display:flex;gap:14px;font-size:11px;color:var(--muted)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
  .chartbody{display:flex;align-items:flex-end;gap:22px}
  .bignum{width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
  .bignum b{font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
  .bignum b span{color:var(--faint)}
  .bignum small{font-size:12px;color:var(--muted)}.bignum small em{font-style:normal;font-weight:700;color:var(--ok)}
  .bars{flex:1;min-width:0}
  .att{display:flex;flex-direction:column;overflow:hidden}
  .att button.row{display:flex;align-items:center;gap:12px;padding:10px 18px;border:0;border-bottom:1px solid #F1F2EF;background:#fff;text-align:left;font:inherit;color:var(--ink);cursor:pointer;width:100%}
  .att button.row:last-child{border-bottom:0}.att button.row:hover{background:#FAFAF8}
  .att .ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--holdbg);color:var(--hold)}
  .att .ic.inj{background:var(--ink);color:#fff}.att .ic.fail{background:var(--badbg);color:var(--bad)}
  .att .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .att .t b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.att .t span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .att .amt{font-family:var(--mono);font-size:12px;font-weight:600}
  .distcard{padding:16px 20px 18px}
  .distcard .top{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .distcard .top b{font-size:14px;font-weight:800}.distcard .top span{font-size:12px;color:var(--muted)}
  .tablecard{display:flex;flex-direction:column;overflow:hidden}
  .tabs{display:flex;align-items:center;gap:2px;padding:4px 12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tabs button{padding:10px 12px;border:0;border-bottom:2px solid transparent;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px}
  .tabs button.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:800}
  .tabs .tools{margin-left:auto;display:flex;gap:8px;align-items:center;padding:4px 0}
  .search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;color:var(--muted)}
  .search input{width:150px;border:0;outline:none;font:inherit;font-size:12px;background:transparent;color:var(--ink)}
  .tablecard td.why{color:var(--text)}
  .tablecard tr.click{cursor:pointer}.tablecard tr.click:hover{background:#FAFAF8}.tablecard tr.sel{background:#EEF2FD}
  .tablecard .doc b{display:block}.tablecard .doc small{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .controls{display:flex;gap:10px;align-items:center}
  .controls label{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text);font-size:12.5px;cursor:pointer}
  .controls select{height:36px;border:1px solid var(--line-strong);border-radius:8px;padding:0 10px;background:#fff;font-weight:700;font-size:12.5px}
  .controls .switch{position:relative;width:36px;height:20px;border-radius:999px;background:#D5D8D2;display:inline-block;transition:background .15s}
  .controls .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:999px;background:#fff;transition:left .15s}
  .controls input:checked + .switch{background:#5B21B6}.controls input:checked + .switch::after{left:18px}
  .controls input[type=checkbox]{position:absolute;opacity:0;width:0;height:0}
  .empty{color:var(--muted);padding:22px;text-align:center}
  /* review drawer */
  .rv .title{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px;font-weight:800}
  .rv .from{color:var(--muted);font-size:12px;margin-top:3px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:12.5px;margin:10px 0 0}
  .kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono);word-break:break-word}
  .reason{background:var(--holdbg);color:var(--hold);border-radius:10px;padding:10px 14px;font-weight:700;margin:12px 0;font-size:13px}
  .reason.ok{background:var(--okbg);color:var(--ok)}.reason.bad{background:var(--badbg);color:var(--bad)}.reason.grey{background:var(--greybg);color:var(--grey)}.reason.shadow{background:var(--shadowbg);color:var(--shadow)}
  .reason .rules{font-weight:500;font-size:11px;margin-top:3px;opacity:.8}
  .box{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:12.5px}
  .box h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  pre{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:11.5px;line-height:1.45;max-height:220px;overflow:auto}
  mark{background:#FFF3BF;padding:0 .1em}
  .verify.ok{color:var(--ok);font-weight:700}.verify.bad{color:var(--bad);font-weight:700}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  textarea{width:100%;font:inherit;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;min-height:60px;margin-top:10px;font-size:13px}
  textarea:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
  .timeline{list-style:none;margin:4px 0 0;padding:0;font-family:var(--mono);font-size:11.5px}
  .timeline li{display:flex;gap:10px;padding:3px 0;border-left:2px solid var(--line);padding-left:10px;align-items:center}
  .timeline li b{min-width:9.5em;font-weight:500;display:flex;gap:6px;align-items:center}
  .timeline li span{color:var(--muted)}
  .actrow{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;padding:3px 0;flex-wrap:wrap}
  .addparty input{width:100%;font:inherit;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;margin-top:3px}
  .addparty label{display:block;font-size:12px;font-weight:700;margin-top:8px}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<main class="page">
  <div class="page-head">
    <div><h1>Today's inbox</h1><div class="sub" id="sub"></div></div>
    <div class="actions controls">
      <label title="Evaluate everything, execute nothing"><input type="checkbox" id="shadow"><span class="switch" aria-hidden="true"></span>Shadow</label>
      <label id="outageWrap">Outage <select id="outage" aria-label="Simulate an outage"><option value="none">none</option><option value="qbo">QuickBooks</option><option value="hubspot">HubSpot</option><option value="slack">Slack</option></select></label>
      <button class="btn" id="resetBtn" type="button">Reset demo</button>
      <a class="btn cta" href="/ask"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>Ask the agent</a>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="two">
    <section class="card chartcard">
      <div class="top"><b>Invoices billed</b><span class="legend"><span><i style="background:var(--blue)"></i>Handled by the agent</span><span><i style="background:var(--blue-soft)"></i>Waiting for a person</span></span></div>
      <div class="chartbody"><div class="bignum"><b id="bigTotal">—</b><small id="bigSub"></small></div><div class="bars" id="chart"></div></div>
    </section>
    <section class="card att">
      <div class="head"><span>Needs your attention</span><span class="chip c-held" id="attN"></span><button type="button" class="btn small" id="reviewAll" style="margin-left:auto">Review all</button></div>
      <div id="attention"></div>
    </section>
  </div>

  <section class="card distcard">
    <div class="top"><b id="distTitle">Where the documents went</b><span>all time · click a status to filter the table below</span></div>
    <div class="dist" id="dist"></div>
    <div class="distlegend" id="distLegend"></div>
  </section>

  <section class="card tablecard" id="tableCard">
    <div class="tabs" id="tabs">
      <button data-f="all" class="on" type="button">All documents</button><button data-f="held" type="button">Waiting</button><button data-f="handled" type="button">Handled</button><button data-f="human" type="button">Human decisions</button><button data-f="ignore" type="button">Ignored</button><button data-f="failed" type="button">Failed</button>
      <div class="tools">
        <select id="period" aria-label="Time period" style="height:32px;border:1px solid var(--line-strong);border-radius:8px;padding:0 8px;background:#fff;font:inherit;font-size:12px;font-weight:700"><option value="all">All time</option><option value="today">Today</option><option value="7d">Last 7 days</option></select>
        <label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input type="search" id="q" placeholder="Search" aria-label="Search documents"></label>
        <a class="btn small" href="/ledger?format=csv"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>Export CSV</a>
      </div>
    </div>
    <div style="overflow:auto"><table><thead><tr><th style="width:44px">#</th><th>Document</th><th>From</th><th>Status</th><th>Amount</th><th>Why</th><th>Received</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Review">
  <div class="head"><b id="rvTitle">Review</b><span class="muted mono" id="rvN" style="font-size:11px"></span><button type="button" class="btn small close" id="closeRv">Close</button></div>
  <div class="body rv" id="review"></div>
</aside>

<script src="/static/nav.js" data-page="dashboard" data-title="Dashboard"></script>
<script>
const $ = s => document.querySelector(s);
const tz = -new Date().getTimezoneOffset();
let items = [], filter = 'all', sel = null, status = null;
const typeLabel = t => ({supplier_invoice:'invoice', customer_dispute:'complaint', remittance:'payment advice', credit_note:'credit note', ignore:'ignored', unknown:'unknown'})[t] || (t || '—');
const statusLabel = s => ({auto_approved:'Auto', executed:'Executed', held:'Held', approved:'Approved', rejected:'Rejected', failed:'Failed', ignore:'Ignored', shadow:'Shadow', received:'Received'})[s] || s;
const chip = (s, extra='') => `<span class="chip c-${s} ${extra}">${statusLabel(s)}</span>`;
const pct = (a, b) => b ? Math.round((a - b) / b * 100) : null;
const delta = (a, b, goodWhenUp = true) => { const p = pct(a, b); if (p == null || !isFinite(p)) return '<span>no data yesterday</span>'; const good = goodWhenUp ? p >= 0 : p <= 0; return `<em class="${good ? '' : 'neg'}">${p >= 0 ? '+' : '−'}${Math.abs(p)}%</em> vs yesterday`; };

async function load() {
  const [st, d, q] = await Promise.all([api('/status'), api(`/dashboard?tz=${tz}`), api('/queue')]);
  status = st; renderNavStatus(st); items = q.items;
  const b = $('#banner'); b.className = 'banner';
  if (st.resetting) { b.textContent = 'Resetting demo…'; b.classList.add('show', 'info'); }
  else if (st.seeding) { b.textContent = `Seeding inbox ${st.seeding.done}/${st.seeding.total}…`; b.classList.add('show', 'info'); }
  else if (st.shadow_mode) { b.textContent = 'Shadow mode: the agent evaluates everything but executes nothing. Turn it off to post to QuickBooks / HubSpot / Slack.'; b.classList.add('show', 'info'); }
  else if (st.llm === 'fake' && !st.presentation) { b.innerHTML = 'Running with the <b>fake model</b> (keyword stand-in). Add an Anthropic API key in <a href="/settings">Settings</a> to see Claude read, extract, verify and answer for real.'; b.classList.add('show', 'warn'); }
  else if (st.last_error && !st.presentation) { b.textContent = 'Last error: ' + st.last_error; b.classList.add('show', 'err'); }
  $('#shadow').checked = !!st.shadow_mode; $('#outage').value = st.simulate_outage || 'none';
  $('#resetBtn').disabled = !!(st.resetting || st.seeding) || st.app_mode === 'live';
  $('#resetBtn').hidden = st.app_mode === 'live' || !!st.presentation;
  $('#outageWrap').hidden = !!st.presentation;

  const t = d.today, y = d.days[d.days.length - 2] || {}, today = d.days[d.days.length - 1] || {};
  $('#sub').textContent = `${new Date(t.date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })} · ${d.run.emails} emails and ${d.run.documents} documents in total · updated ${new Date(d.snapshot_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;
  const share = t.documents ? Math.round(t.auto_executed / Math.max(1, t.documents - t.ignored) * 100) : 0;
  $('#kpis').innerHTML = `
    <div class="kpi"><small>Emails received</small><b>${t.emails}</b><div class="d">${delta(today.received, y.received)}</div></div>
    <div class="kpi"><small>Handled by the agent</small><b>${t.auto_executed}</b><div class="d"><em>${share}%</em> of today, no human touch</div></div>
    <div class="kpi hold"><small>Waiting for you</small><b>${t.held}</b><div class="d">${delta(today.held, y.held, false)}</div></div>
    <div class="kpi ${t.failed ? 'bad' : ''}"><small>${t.failed ? 'Failed actions' : 'AI cost today'}</small><b>${t.failed ? t.failed : '$' + t.cost_usd.toFixed(3)}</b><div class="d">${t.failed ? 'retry from the table below' : '$' + d.run.cost_usd.toFixed(3) + ' in total · ~4 model calls per document'}</div></div>`;

  const waitingInv = items.filter(i => i.doc_type === 'supplier_invoice' && i.status === 'held').length;
  const [w, f] = d.run.invoices_total.toFixed(2).split('.');
  $('#bigTotal').innerHTML = `£${Number(w).toLocaleString('en-GB')}<span>.${f}</span>`;
  $('#bigSub').innerHTML = `<em>${d.run.invoices}</em> invoices in total · ${waitingInv} waiting`;
  renderChart(d.days);

  $('#attN').textContent = d.attention_total + ' open';
  $('#attention').innerHTML = d.attention.length ? d.attention.slice(0, 6).map(a => {
    const inj = /instruction-like/.test(a.reason || ''), fail = a.status === 'failed';
    const ic = fail ? ICONS.bell : inj ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>' : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>';
    return `<button type="button" class="row" data-id="${a.document_id}"><span class="ic ${inj ? 'inj' : fail ? 'fail' : ''}">${ic}</span><span class="t"><b>${esc(a.subject)}</b><span>${esc(a.party || 'not on file')} · ${esc(a.reason)}</span></span><span class="amt">${a.amount ? money(a.amount) : ''}</span></button>`;
  }).join('') : '<div class="empty">Nothing needs a person right now.</div>';

  renderDist(st.counts || {}, d.run.documents);
  renderTable();
  if (sel) loadReview(sel, true);
}

function renderChart(days) {
  const W = 640, H = 170, padB = 24, padT = 34, gap = 18;
  const max = Math.max(1, ...days.map(x => x.invoices_total));
  const bw = (W - gap * days.length) / days.length;
  const h = v => (H - padT - padB) * (v / max);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="invoices billed per day, handled vs waiting">`;
  svg += `<line x1="0" x2="${W}" y1="${H - padB}" y2="${H - padB}" stroke="#ECEDEA"/>`;
  days.forEach((d, i) => {
    const x = gap / 2 + i * (bw + gap), base = H - padB, hh = h(d.handled_total), hw = h(d.waiting_total);
    if (hw > 0) svg += `<rect x="${x}" y="${base - hh - hw}" width="${bw}" height="${hw}" rx="3" fill="#C9D4F6"><title>${d.label}: waiting ${money(d.waiting_total)}</title></rect>`;
    if (hh > 0) svg += `<rect x="${x}" y="${base - hh}" width="${bw}" height="${hh}" rx="3" fill="#1F4FD8"><title>${d.label}: handled ${money(d.handled_total)}</title></rect>`;
    if (d.invoices_total > 0) svg += `<text x="${x + bw / 2}" y="${base - hh - hw - 6}" font-size="10" text-anchor="middle" fill="#3F4650" font-family="IBM Plex Mono,monospace">£${Math.round(d.invoices_total).toLocaleString('en-GB')}</text>`;
    svg += `<text x="${x + bw / 2}" y="${H - 7}" font-size="11" text-anchor="middle" fill="#5B6470" font-family="IBM Plex Mono,monospace">${d.label.split(' ')[0]}</text>`;
  });
  $('#chart').innerHTML = svg + '</svg>';
}

function renderDist(c, total) {
  total = Math.max(1, total);
  const handled = (c.executed || 0) + (c.auto_approved || 0) + (c.approved || 0), waiting = (c.held || 0), rejected = (c.rejected || 0), ignored = (c.ignore || 0), failed = (c.failed || 0), shadow = (c.shadow || 0);
  const segs = [
    ['handled', 'Handled by the agent', handled, 'var(--blue)', 'posted to QuickBooks / HubSpot / Slack without a person'],
    ['held', 'Waiting for a person', waiting, '#F5B14C', 'held with a reason — approve or reject'],
    ['human', 'Decided by a person', rejected, '#7C3AED', 'rejected after review'],
    ['ignore', 'Ignored', ignored, '#B8BEC6', 'duplicates, newsletters, catalogues'],
    ['failed', 'Failed', failed, 'var(--bad)', 'a downstream system was unavailable — retry'],
    ['shadow', 'Shadow', shadow, '#C4B5FD', 'evaluated only, nothing executed'],
  ].filter(s => s[2] > 0);
  $('#distTitle').textContent = `Where the ${total} documents went`;
  $('#dist').innerHTML = segs.map(([k, label, n, color]) => `<i style="width:${n / total * 100}%;background:${color}" title="${label}: ${n}"></i>`).join('');
  $('#distLegend').innerHTML = segs.map(([k, label, n, color, note]) => `<div title="${esc(note)}" style="cursor:pointer" data-f="${k}"><i style="background:${color}"></i>${label}<b>${n}</b><span class="p">${Math.round(n / total * 100)}%</span></div>`).join('');
}
$('#distLegend').addEventListener('click', e => { const el = e.target.closest('[data-f]'); if (!el) return; setFilter(el.dataset.f); $('#tableCard').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
function setFilter(f) { filter = f; document.querySelectorAll('#tabs button[data-f]').forEach(x => x.classList.toggle('on', x.dataset.f === f)); renderTable(); }

function renderTable() {
  const q = ($('#q').value || '').toLowerCase();
  let rows = items;
  const period = $('#period').value;
  if (period !== 'all') {
    const now = new Date(), start = new Date(now); start.setHours(0, 0, 0, 0);
    if (period === '7d') start.setDate(start.getDate() - 6);
    rows = rows.filter(r => new Date(r.received_at) >= start);
  }
  if (filter === 'held') rows = rows.filter(r => r.status === 'held');
  else if (filter === 'handled') rows = rows.filter(r => ['executed', 'approved', 'auto_approved'].includes(r.status));
  else if (filter === 'human') rows = rows.filter(r => r.human_override);
  else if (filter === 'ignore') rows = rows.filter(r => r.status === 'ignore');
  else if (filter === 'failed') rows = rows.filter(r => r.status === 'failed');
  else if (filter === 'shadow') rows = rows.filter(r => r.status === 'shadow');
  if (q) rows = rows.filter(r => [r.subject, r.filename, r.party_name, r.from_addr, r.reason, r.ref].join(' ').toLowerCase().includes(q));
  rows = rows.slice().sort((a, b) => new Date(b.received_at) - new Date(a.received_at));
  $('#rows').innerHTML = rows.map(r => `<tr class="click ${sel === r.document_id ? 'sel' : ''}" data-id="${r.document_id}">
    <td class="mono muted">${r.seed_no ?? r.document_id}</td>
    <td class="doc"><b>${esc(r.ref ? r.ref + ' ' + typeLabel(r.doc_type) : r.subject)}</b><small>${esc(r.filename === 'email-body.txt' ? 'email body' : r.filename)}</small></td>
    <td>${esc(r.party_name || r.from_addr)}</td>
    <td>${chip(r.status)}${r.injection ? ' <span class="chip inj">injection blocked</span>' : ''}${r.human_override ? ' <span class="chip human">human</span>' : ''}${r.simulated && !window.PRESENT ? ' <span class="chip sim">sim</span>' : ''}</td>
    <td class="mono">${r.amount ? money(r.amount) : '—'}</td>
    <td class="why">${esc(r.reason || '')}</td>
    <td class="mono muted">${new Date(r.received_at).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Nothing here.</td></tr>';
}
$('#rows').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr) openReview(+tr.dataset.id); });
$('#attention').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b) openReview(+b.dataset.id); });
$('#reviewAll').addEventListener('click', () => { setFilter('held'); $('#tableCard').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-f]'); if (b) setFilter(b.dataset.f); });
$('#q').addEventListener('input', renderTable);
$('#period').addEventListener('change', renderTable);

// --- review drawer -----------------------------------------------------------------------------------
function openReview(id) { sel = id; renderTable(); $('#drawer').classList.add('open'); $('#scrim').classList.add('open'); history.replaceState(null, '', '#doc-' + id); loadReview(id); }
function closeReview() { sel = null; renderTable(); $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); history.replaceState(null, '', location.pathname); }
$('#closeRv').addEventListener('click', closeReview); $('#scrim').addEventListener('click', closeReview);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReview(); });

async function loadReview(id, quiet) {
  let d; try { d = await api('/review/' + id); } catch (e) { if (!quiet) toast(e.message); return; }
  const it = d.item, ex = it.extracted || {}, vr = it.verify_result;
  $('#rvTitle').textContent = typeLabel(it.doc_type).replace(/^./, c => c.toUpperCase()); $('#rvN').textContent = '#' + (it.seed_no ?? '') + ' · doc ' + it.document_id;
  const reasonClass = {executed:'ok', auto_approved:'ok', approved:'ok', failed:'bad', rejected:'bad', ignore:'grey', shadow:'shadow'}[it.status] || '';
  const snippet = highlight(esc(it.source_snippet || d.email_body || ''), ex);
  const extractedRows = Object.entries(ex).filter(([k,v]) => v !== null && v !== '' && !(Array.isArray(v) && !v.length)).map(([k,v]) =>
    `<dt>${esc(k.replace(/_/g,' '))}</dt><dd>${Array.isArray(v) ? esc(v.map(x => typeof x === 'object' ? (x.description + ' ' + (x.amount ?? '')) : x).join('; ')) : esc(v)}</dd>`).join('');
  const rulesDec = (d.decisions || []).filter(x => x.step === 'rules').pop();
  const triggered = rulesDec && rulesDec.output && rulesDec.output.triggered_rules ? rulesDec.output.triggered_rules.join(', ') : '';
  const canDecide = ['held','shadow'].includes(it.status), canRetry = it.status === 'failed', canReject = ['held','shadow','failed'].includes(it.status);
  const noMatch = /^no (supplier|customer) match/.test(it.reason || '');
  $('#review').innerHTML = `
    <div class="title">${esc(it.subject)} ${chip(it.status)}</div>
    <div class="from">from <span class="mono">${esc(it.from_addr)}</span> · <span class="mono">${esc(it.filename === 'email-body.txt' ? 'email body' : it.filename)}</span></div>
    <div class="reason ${reasonClass}">${esc(it.reason || '—')}${triggered ? `<div class="rules">rules: ${esc(triggered)}</div>` : ''}</div>
    <dl class="kv">
      <dt>party</dt><dd>${esc(it.party_name || '—')}${it.party_kind ? ' <span class="muted">(' + it.party_kind + ')</span>' : ''}</dd>
      <dt>confidence</dt><dd>${it.confidence != null ? it.confidence.toFixed(2) : '—'}</dd>
      ${it.duplicate_of ? `<dt>duplicate of</dt><dd><a href="#" onclick="openReview(${it.duplicate_of});return false">doc #${it.duplicate_of}</a></dd>` : ''}
      <dt>AI cost</dt><dd>$${(it.cost_usd||0).toFixed(4)}</dd>
    </dl>
    ${noMatch ? `<div class="box addparty" id="addParty"><h4>Not on file</h4><div class="muted" style="margin-bottom:8px">This sender is not in the directory. Add them once and this item is processed again automatically.</div><button class="btn small primary" type="button" onclick="suggestParty(${it.document_id})">Add as ${/customer/.test(it.reason) ? 'customer' : 'supplier'} →</button></div>` : ''}
    ${(canDecide || canRetry) ? `<textarea id="note" placeholder="${canRetry ? 'Optional note' : 'Required: one line on why (recorded in the ledger)'}"></textarea>` : ''}
    <div class="actions">
      ${canDecide ? `<button class="btn primary" type="button" onclick="decide(${it.document_id},'approve')">Approve → execute</button>` : ''}
      ${canReject ? `<button class="btn" type="button" onclick="decide(${it.document_id},'reject')">Reject</button>` : ''}
      ${canRetry ? `<button class="btn cta" type="button" onclick="retry(${it.document_id})">Retry failed action</button>` : ''}
    </div>
    ${extractedRows ? `<div class="box"><h4>Extracted</h4><dl class="kv" style="margin:0">${extractedRows}</dl></div>` : ''}
    ${vr ? `<div class="box"><h4>Verifier — second model</h4><div class="verify ${vr.all_fields_present?'ok':'bad'}">${vr.all_fields_present ? '✓ every extracted value is literally present in the source' : '✗ unsupported: ' + esc((vr.missing_or_unsupported||[]).join(', '))}</div>${vr.notes ? `<div class="muted" style="margin-top:3px">${esc(vr.notes)}</div>` : ''}</div>` : ''}
    <div class="box"><h4>Source — what the agent read</h4><pre>${snippet}</pre></div>
    ${it.draft_reply ? `<div class="box"><h4>Draft reply — held with the ticket, never auto-sent</h4><pre>${esc(it.draft_reply)}</pre></div>` : ''}
    ${it.actions.length ? `<div class="box"><h4>Where it went</h4>${it.actions.map(a => `<div class="actrow">${chip(a.status==='ok'?'executed':'failed')} <b>${a.status === 'ok' ? esc(actionLabel(a)) : a.system}</b> ${a.result && a.result.url ? `<a href="${esc(a.result.url)}" target="_blank" rel="noopener">open ↗</a>` : ''} ${a.result && a.result.simulated && !window.PRESENT ? '<span class="chip sim">simulated</span>' : ''} ${a.error ? `<span style="color:var(--bad)">${esc(a.error)}</span>` : ''}</div>`).join('')}</div>` : ''}
    ${d.notes && d.notes.length ? `<div class="box"><h4>Human notes</h4>${d.notes.map(n => `<div class="actrow"><b>${n.action}</b> ${esc(n.note)} <span class="muted">· ${n.by} · ${new Date(n.at).toLocaleTimeString('en-GB')}</span></div>`).join('')}</div>` : ''}
    <div class="box"><h4>Timeline</h4><ul class="timeline">${it.timeline.map(t => `<li><b>${esc(t.step)}${t.model ? (t.model === 'fake' ? (window.PRESENT ? '<span class="badge model">ai</span>' : '<span class="chip sim">fake ai</span>') : '<span class="badge model">claude</span>') : ''}</b><span>${new Date(t.at).toLocaleTimeString('en-GB')}${t.duration_ms != null ? ' · ' + t.duration_ms + ' ms' : ''}${t.model && t.model !== 'fake' ? ' · ' + t.model : ''}</span></li>`).join('')}</ul></div>`;
}
function highlight(text, ex) {
  const vals = Object.values(ex || {}).filter(v => typeof v === 'string' || typeof v === 'number').map(String).filter(v => v.length > 2).sort((a,b)=>b.length-a.length);
  for (const v of vals) {
    const alt = [v, Number(v) ? Number(v).toLocaleString('en-GB',{minimumFractionDigits:2}) : null].filter(Boolean);
    for (const a of alt) { const re = new RegExp(a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g'); text = text.replace(re, m => `<mark>${m}</mark>`); }
  }
  return text;
}
async function suggestParty(id) {
  const box = document.getElementById('addParty');
  let sg; try { sg = await api('/api/parties/suggest/' + id); } catch (e) { toast(e.message); return; }
  box.innerHTML = `<h4>Add ${sg.kind}</h4>
    <div class="muted">${esc(sg.why)} — check the email the agent should recognise next time.</div>
    <label>Name<input id="p-name" value="${esc(sg.name)}"></label>
    <label>Email address(es)<input id="p-pat" class="mono" value="${esc(sg.emails.join(', '))}"></label>
    <label>Reference prefix <span class="muted" style="font-weight:500">(optional)</span><input id="p-prefix" class="mono" value="${esc((sg.reference_prefix || '').replace(/-$/, ''))}"></label>
    ${sg.kind === 'supplier' ? `<label>Expected invoice amount / PO <span class="muted" style="font-weight:500">(optional, ±5% check)</span><input id="p-po" class="mono" value="${sg.po_amount ?? ''}"></label>` : ''}
    <div class="actions"><button class="btn small primary" type="button" onclick="createPartyFromDoc(${id},'${sg.kind}')">Save &amp; process again</button><button class="btn small" type="button" onclick="loadReview(${id})">Cancel</button></div>`;
}
async function createPartyFromDoc(id, kind) {
  const body = { name: document.getElementById('p-name').value, identifier_patterns: document.getElementById('p-pat').value, reference_prefix: document.getElementById('p-prefix').value };
  if (kind === 'supplier') body.po_amount = document.getElementById('p-po').value || null;
  try { const r = await api(`/api/parties/from_document/${id}?kind=${kind}`, { method: 'POST', body: JSON.stringify(body) }); toast(`added · now ${r.status}`); await load(); }
  catch (e) { toast(e.message); }
}
async function decide(id, action) {
  const note = ($('#note') ? $('#note').value.trim() : '');
  if (note.length < 3) { toast('Please write a short note first'); $('#note').focus(); return; }
  try { const r = await api(`/${action}/${id}`, {method:'POST', body: JSON.stringify({note, by:'demo'})}); toast(`${action}d → ${r.status}`); await load(); }
  catch (e) { toast(e.message); }
}
async function retry(id) { try { const r = await api(`/retry/${id}`, {method:'POST'}); toast('retry → ' + r.status); await load(); } catch (e) { toast(e.message); } }

$('#shadow').addEventListener('change', async e => { try { await api('/shadow', {method:'POST', body: JSON.stringify({enabled: e.target.checked})}); toast('shadow mode ' + (e.target.checked ? 'on' : 'off')); await load(); } catch (err) { toast(err.message); } });
$('#outage').addEventListener('change', async e => { try { await api('/outage', {method:'POST', body: JSON.stringify({system: e.target.value})}); toast('outage: ' + e.target.value); await load(); } catch (err) { toast(err.message); } });
$('#resetBtn').addEventListener('click', async () => { if (!confirm('Wipe the current run and replay the 30 seed emails?')) return; try { await api('/reset', { method: 'POST' }); toast('reset started'); closeReview(); setTimeout(load, 800); } catch (e) { toast(e.message); } });

function connect() { const es = new EventSource('/events'); es.addEventListener('changed', () => load().catch(() => {})); es.onerror = () => { es.close(); setTimeout(connect, 3000); }; }
load().then(() => { const m = location.hash.match(/doc-(\d+)/); if (m) openReview(+m[1]); else if (location.hash === '#waiting') { setFilter('held'); $('#tableCard').scrollIntoView({ block: 'start' }); } }).catch(e => toast(e.message)); connect();
window.addEventListener('hashchange', () => { const m = location.hash.match(/doc-(\d+)/); if (m) openReview(+m[1]); });
</script>
</body>
</html>
